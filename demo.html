<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Démo statistique</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .barre {
      background: #25a56a;
      margin: 12px auto;
      padding: 10px;
      border-radius: 6px;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <h1>Mon tableau statistique</h1>
  <p>Exemple de données numériques</p>

  <div class="barre" style="width: 40%">Donnée 1 : 2</div>
  <div class="barre" style="width: 60%">Donnée 2 : 3</div>
  <div class="barre" style="width: 80%">Donnée 3 : 4</div>
  <div class="barre" style="width: 50%">Donnée 4 : 2,5</div>

  <h2>Moyenne : 2,875</h2>
</body>
</html>
